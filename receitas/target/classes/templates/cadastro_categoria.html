<!-- Beatriz Lima Evangelista e Julia Santos de Souza -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Categoria</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="py-5">
	<div class="container">
		<form action="/categorias/salvar" method="post">
			<div class="mb-3">
				<h1 class="titulo-principal">Cadastrar Categoria</h1>
			    <p class="display-8">Desenvolvido por Beatriz Lima Evangelista e Julia Santos de Souza</p>
			</div>
			
			<div class="mb-3">
				<label for="txtNome" class="form-label">Nome</label>
				<input type="text" name="txtNome" placeholder="Ex: Massas, Sobremesas" class="form-control" required>
			</div>
			
			<div class="mb-3">
				<label for="txtDescricao" class="form-label">Descrição</label>
				<textarea name="txtDescricao" rows="4" placeholder="Descreva a categoria..." class="form-control" required></textarea>
			</div>
			
			<button type="submit" class="btn btn-purple">Cadastrar</button>	
		</form>
	</div>
</body>
</html>
