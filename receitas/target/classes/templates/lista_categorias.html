<!-- Beatriz Lima Evangelista e Julia Santos de Souza -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Categorias</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="py-5">
	<div class="container">
		<div class="mb-4">
			<h1 class="titulo-principal">Categorias Cadastradas</h1>
			<p class="display-8">Desenvolvido por Beatriz Lima Evangelista e Julia Santos de Souza</p>
		</div>
		
		<div>
			<table class="table table-striped"> 
					<thead> 
						<tr> 
							<th scope="col">ID</th> 
							<th scope="col">Nome</th>
							<th scope="col">Descrição</th> 
						</tr> 
					</thead> 
					<tbody> 
						<tr th:each="categoria : ${listaCategorias}"> 
							<th scope="row" th:text="${categoria.id}"></th> 
							<td th:text="${categoria.nome}"></td> 
							<td th:text="${categoria.descricao}"></td> 
						</tr> 
					</tbody> 
				</table> 
				
				<div>
				    <a th:href="@{/categorias/nova}" class="btn btn-purple">
				        Novas Categorias
				    </a> 

				    <a th:href="@{/}" class="btn btn-outline-secondary" style="text-decoration: none; display: inline-block;">
				        Voltar ao Inicio
				    </a>
				</div>
		</div>
	</div>
</body>
